databases:
  - name: fintech-db
    databaseName: fintech
    user: fintech_user          # "postgres" is reserved, so use another name
    plan: free

services:
  # -------------------------------------------------------------------------
  # FastAPI Backend Service
  # -------------------------------------------------------------------------
  - type: web
    name: fintech-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-db
          property: connectionString
      # Public URL of the frontend (fromService cannot return a public URL)
      - key: CORS_ALLOWED_ORIGINS
        value: https://fintech-frontend.onrender.com
      - key: AWS_REGION
        value: ap-south-1
      # sync: false = Render asks you for the value in the dashboard
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_APP_CLIENT_ID
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # -------------------------------------------------------------------------
  # Next.js Frontend Service
  # -------------------------------------------------------------------------
  - type: web
    name: fintech-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Public URL of the backend (fromService cannot return a public URL)
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://fintech-backend.onrender.com
      - key: NEXT_PUBLIC_AWS_REGION
        value: ap-south-1
      - key: NEXT_PUBLIC_COGNITO_USER_POOL_ID
        sync: false
      - key: NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID
        sync: false
