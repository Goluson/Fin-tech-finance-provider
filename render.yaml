databases:
  - name: fintech-db
    databaseName: fintech
    user: postgres
    plan: free

services:
  # -------------------------------------------------------------------------
  # FastAPI Backend Service
  # -------------------------------------------------------------------------
  - type: web
    name: fintech-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: fintech-frontend
          property: url
      - key: AWS_REGION
        value: ap-south-1
      - key: COGNITO_USER_POOL_ID
        value: ""
      - key: COGNITO_APP_CLIENT_ID
        value: ""
      - key: S3_BUCKET_NAME
        value: ""

  # -------------------------------------------------------------------------
  # Next.js Frontend Service
  # -------------------------------------------------------------------------
  - type: web
    name: fintech-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: fintech-backend
          property: url
      - key: NEXT_PUBLIC_AWS_REGION
        value: ap-south-1
      - key: NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID
        value: ""
