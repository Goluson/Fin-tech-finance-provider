databases:
  - name: fintech-db
    databaseName: fintech
    user: fintech_user
    plan: free

services:
  # -------------------------------------------------------------------------
  # FastAPI Backend Service
  # -------------------------------------------------------------------------
  - type: web
    name: fintech-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: fintech-db
          property: connectionString
      # Public URL of the frontend for CORS
      - key: CORS_ALLOWED_ORIGINS
        value: https://fintech-frontend.onrender.com,http://localhost:3000
      - key: AWS_REGION
        value: ap-south-1
      # sync: false = Render prompts for these in the dashboard if available
      - key: COGNITO_USER_POOL_ID
        sync: false
      - key: COGNITO_APP_CLIENT_ID
        sync: false
      - key: S3_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # -------------------------------------------------------------------------
  # Next.js Frontend Service
  # -------------------------------------------------------------------------
  - type: web
    name: fintech-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    # Bind to Render dynamic port ($PORT) instead of default 3000
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Public URL of the backend
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://fintech-backend.onrender.com
      - key: NEXT_PUBLIC_AWS_REGION
        value: ap-south-1
      - key: NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID
        sync: false
