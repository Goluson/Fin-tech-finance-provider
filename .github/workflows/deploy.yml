name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI VALIDATION (Test & Build Check)
  # =========================================================================
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Backend Validation ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Syntax & Compilation
        working-directory: backend
        run: |
          python -m compileall app/

      # --- Frontend Validation ---
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Next.js Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_AWS_REGION: ${{ vars.NEXT_PUBLIC_AWS_REGION || 'ap-south-1' }}
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID || '' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}
        run: |
          npm run build

  # =========================================================================
  # 2. AWS DEPLOYMENT (App Runner / ECR)
  # =========================================================================
  deploy-aws:
    name: Deploy to AWS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check AWS Secrets Availability
        id: check_aws
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice::AWS credentials not detected in repository secrets. Skipping AWS deployment."
          fi

      - name: Checkout Code
        if: steps.check_aws.outputs.has_creds == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: steps.check_aws.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        if: steps.check_aws.outputs.has_creds == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build & Push Backend ---
      - name: Build and Push Backend Image to ECR
        if: steps.check_aws.outputs.has_creds == 'true' && secrets.ECR_BACKEND_REPO != ''
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_BACKEND_REPO }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: backend
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      # --- Build & Push Frontend ---
      - name: Build and Push Frontend Image to ECR
        if: steps.check_aws.outputs.has_creds == 'true' && secrets.ECR_FRONTEND_REPO != ''
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_FRONTEND_REPO }}
          IMAGE_TAG: ${{ github.sha }}
          NEXT_PUBLIC_AWS_REGION: ${{ vars.NEXT_PUBLIC_AWS_REGION || secrets.AWS_REGION || 'ap-south-1' }}
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID || secrets.COGNITO_APP_CLIENT_ID || '' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || secrets.API_BASE_URL || '' }}
        working-directory: frontend
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_AWS_REGION="$NEXT_PUBLIC_AWS_REGION" \
            --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID="$NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID" \
            --build-arg NEXT_PUBLIC_API_BASE_URL="$NEXT_PUBLIC_API_BASE_URL" \
            -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      # --- Trigger AWS App Runner Deployment ---
      - name: Trigger App Runner Backend Deployment
        if: steps.check_aws.outputs.has_creds == 'true' && secrets.AWS_APP_RUNNER_BACKEND_ARN != ''
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_APP_RUNNER_BACKEND_ARN }}

      - name: Trigger App Runner Frontend Deployment
        if: steps.check_aws.outputs.has_creds == 'true' && secrets.AWS_APP_RUNNER_FRONTEND_ARN != ''
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_APP_RUNNER_FRONTEND_ARN }}

  # =========================================================================
  # 3. RENDER DEPLOY HOOK (Optional / Parallel Cloud Deployment)
  # =========================================================================
  deploy-render:
    name: Deploy to Render (Optional)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Backend Deploy Hook
        if: secrets.RENDER_BACKEND_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Trigger Render Frontend Deploy Hook
        if: secrets.RENDER_FRONTEND_DEPLOY_HOOK != ''
        run: |
          curl -s -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
