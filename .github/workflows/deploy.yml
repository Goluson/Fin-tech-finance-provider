name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CI VALIDATION (Test & Build Check)
  # =========================================================================
  ci:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Backend Validation ---
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Backend Syntax & Compilation
        working-directory: backend
        run: |
          python -m compileall app/

      # --- Frontend Validation ---
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package.json"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Next.js Frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_AWS_REGION: ap-south-1
          NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID: ""
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
        run: |
          npm run build

  # =========================================================================
  # 2. AWS DEPLOYMENT (App Runner / ECR)
  # =========================================================================
  deploy-aws:
    name: Deploy to AWS
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
      ECR_BACKEND_REPO: ${{ secrets.ECR_BACKEND_REPO }}
      ECR_FRONTEND_REPO: ${{ secrets.ECR_FRONTEND_REPO }}
      AWS_APP_RUNNER_BACKEND_ARN: ${{ secrets.AWS_APP_RUNNER_BACKEND_ARN }}
      AWS_APP_RUNNER_FRONTEND_ARN: ${{ secrets.AWS_APP_RUNNER_FRONTEND_ARN }}

    steps:
      - name: Check AWS Secrets Availability
        id: check_aws
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "AWS credentials detected."
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "AWS credentials not detected in repository secrets. Skipping AWS container deployment."
          fi

      - name: Checkout Code
        if: steps.check_aws.outputs.has_creds == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: steps.check_aws.outputs.has_creds == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Log in to Amazon ECR
        if: steps.check_aws.outputs.has_creds == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --- Build & Push Backend ---
      - name: Build and Push Backend Image to ECR
        if: steps.check_aws.outputs.has_creds == 'true'
        run: |
          if [ -n "$ECR_BACKEND_REPO" ]; then
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            IMAGE_TAG="${{ github.sha }}"
            cd backend
            docker build -t "$REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG" -t "$REGISTRY/$ECR_BACKEND_REPO:latest" .
            docker push "$REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG"
            docker push "$REGISTRY/$ECR_BACKEND_REPO:latest"
          else
            echo "ECR_BACKEND_REPO secret not set. Skipping backend image push."
          fi

      # --- Build & Push Frontend ---
      - name: Build and Push Frontend Image to ECR
        if: steps.check_aws.outputs.has_creds == 'true'
        run: |
          if [ -n "$ECR_FRONTEND_REPO" ]; then
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            IMAGE_TAG="${{ github.sha }}"
            cd frontend
            docker build \
              --build-arg NEXT_PUBLIC_AWS_REGION="${{ secrets.AWS_REGION || 'ap-south-1' }}" \
              --build-arg NEXT_PUBLIC_COGNITO_USER_POOL_CLIENT_ID="${{ secrets.COGNITO_APP_CLIENT_ID }}" \
              --build-arg NEXT_PUBLIC_API_BASE_URL="${{ secrets.API_BASE_URL }}" \
              -t "$REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG" -t "$REGISTRY/$ECR_FRONTEND_REPO:latest" .
            docker push "$REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG"
            docker push "$REGISTRY/$ECR_FRONTEND_REPO:latest"
          else
            echo "ECR_FRONTEND_REPO secret not set. Skipping frontend image push."
          fi

      # --- Trigger AWS App Runner Deployment ---
      - name: Trigger App Runner Deployments
        if: steps.check_aws.outputs.has_creds == 'true'
        run: |
          if [ -n "$AWS_APP_RUNNER_BACKEND_ARN" ]; then
            echo "Triggering backend App Runner deployment..."
            aws apprunner start-deployment --service-arn "$AWS_APP_RUNNER_BACKEND_ARN"
          fi
          if [ -n "$AWS_APP_RUNNER_FRONTEND_ARN" ]; then
            echo "Triggering frontend App Runner deployment..."
            aws apprunner start-deployment --service-arn "$AWS_APP_RUNNER_FRONTEND_ARN"
          fi

  # =========================================================================
  # 3. RENDER DEPLOYMENT (Optional Webhook)
  # =========================================================================
  deploy-render:
    name: Deploy to Render (Optional)
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
      RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render Deploy Hooks
        run: |
          if [ -n "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "Triggering Render backend deployment..."
            curl -s -f -X POST "$RENDER_BACKEND_DEPLOY_HOOK"
          fi
          if [ -n "$RENDER_FRONTEND_DEPLOY_HOOK" ]; then
            echo "Triggering Render frontend deployment..."
            curl -s -f -X POST "$RENDER_FRONTEND_DEPLOY_HOOK"
          fi
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ] && [ -z "$RENDER_FRONTEND_DEPLOY_HOOK" ]; then
            echo "No Render deploy hooks configured. Skipping."
          fi
